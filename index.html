<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JLPT 單字例句（五十音順）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c0392b; --accent2:#8e44ad;
  --paper:#fbf7f0; --card:#ffffff; --ink:#2b2320; --sub:#6f635b;
  --line:#e7ddcf; --chip:#f1e9dc; --ok:#1e8449; --shadow:0 2px 8px rgba(80,50,30,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
header.top{
  position:sticky; top:0; z-index:30; background:rgba(251,247,240,.96);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px 0}
.top h1{font-size:1.15rem;margin:0 0 2px;font-weight:700}
.top p{margin:0;color:var(--sub);font-size:.82rem}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.head-title{min-width:0}
.head-tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap}
.tab{
  appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:7px 12px;border-radius:10px 10px 0 0;font-size:1.02rem;font-weight:600;cursor:pointer;
  border-bottom:none;transition:.15s;white-space:nowrap;flex:0 0 auto;
}
.tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
.toolbar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{width:auto;max-width:70vw;display:inline-flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.search input{border:none;outline:none;background:none;font-size:.95rem;color:var(--ink);
  field-sizing:content;width:auto;min-width:2em;max-width:60vw}
.btn-stop{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn-stop:hover{border-color:var(--accent);color:var(--accent)}
.chipnav{max-width:1080px;margin:0 auto;padding:0 16px 6px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chipnav a{white-space:nowrap;text-decoration:none;font-size:.8rem;color:var(--sub);
  background:var(--chip);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.chipnav a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:8px 16px 80px}
.cat{margin:26px 0 8px;scroll-margin-top:150px}
.cat-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--accent);padding-bottom:8px;margin-bottom:14px}
.cat-h h2{font-size:1.15rem;margin:0;font-weight:700}
.cat-h .cnt{color:var(--sub);font-size:.8rem;font-weight:500}
.play-all{appearance:none;cursor:pointer;margin-left:auto;border:1px solid var(--accent);
  color:var(--accent);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
.play-all:hover{background:var(--accent);color:#fff}
.play-all.playing{background:var(--accent);color:#fff}
.play-all.playing .ico::before{content:"■"}
.play-all .ico::before{content:"▶"}
.play-zhja{border-color:var(--accent2);color:var(--accent2)}
.play-zhja:hover{background:var(--accent2);color:#fff}
.play-zhja.playing{background:var(--accent2);color:#fff}
.subhead{font-size:.9rem;font-weight:700;color:var(--accent2);margin:16px 0 8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;scroll-margin-top:150px}
.subhead::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.word{font-size:1.5rem;font-weight:700;line-height:1.2;cursor:pointer;border:none;background:none;
  color:var(--ink);padding:0;font-family:"Noto Serif JP",serif;text-align:left}
.word:hover{color:var(--accent)}
.idx-badge{color:var(--sub);font-size:.85rem;font-weight:600;margin-right:4px}
.word::after{content:"🔊";font-size:.7rem;margin-left:5px;opacity:.4;vertical-align:middle}
.word:hover::after{opacity:.9}
.word.playing{color:var(--accent);text-decoration:underline}
.kana{color:var(--sub);font-size:.9rem}
.romaji{color:#b7a99a;font-size:.76rem;font-style:italic}
.mean{color:var(--ink);font-size:.92rem}
.mean b{color:var(--accent);font-weight:600}
.ex{margin-top:2px;padding:9px 11px;background:var(--paper);border-radius:10px;border:1px solid var(--line)}
.ex-line{display:flex;align-items:flex-start;gap:8px}
.ex-ja{flex:1;font-family:"Noto Serif JP",serif;font-size:1.02rem;font-weight:600}
.ex-kana{color:var(--sub);font-size:.82rem;margin-top:2px}
.ex-zh{color:var(--sub);font-size:.85rem;margin-top:1px}
.say{appearance:none;flex:none;cursor:pointer;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:.8rem;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.say:hover{background:var(--accent);color:#fff}
.say.playing{background:var(--accent);color:#fff;animation:pulse 1s infinite}
.say::before{content:"▶"}
.say.playing::before{content:"■"}
@keyframes pulse{50%{opacity:.55}}
/* ch3 */
.k-onkun{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--sub)}
.k-onkun b{color:var(--ink);font-weight:600;margin-right:3px}
.k-rei{font-family:"Noto Serif JP",serif;font-size:.95rem;color:var(--ink)}
.k-rei-line{font-size:.84rem;color:var(--sub);font-family:"Noto Serif JP",serif}
.rei-lbl{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:.7rem;
  color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 5px;margin-right:6px;vertical-align:middle}
/* 形容詞反義配對 */
.ant{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.ant-mark{font-size:.7rem;color:var(--accent2);border:1px solid var(--accent2);border-radius:5px;padding:0 6px;font-family:"Noto Sans TC",sans-serif}
.ant .word{font-size:1.2rem}
.ex-ant .ex-ja{font-weight:600}
.ex-ant{border-style:dashed}
/* 五十音卡 */
.kana-card .word{font-size:2.3rem}
.kana-card .card-top{align-items:center}
/* 五十音例句卡（50 tab） */
.k50-row2{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.k50-zh{color:var(--ink);font-size:.92rem}
.hidden{display:none !important}
.empty-note{color:var(--sub);text-align:center;padding:30px}
footer{max-width:1080px;margin:0 auto;padding:16px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--line)}
@media (max-width:640px){
  /* 標題與搜尋維持同一列，搜尋靠右、不換行 */
  .head-row{align-items:center;gap:10px}
  .search input{min-width:0;max-width:52vw}
}
@media (max-width:520px){
  .word{font-size:1.35rem}
  .grid{grid-template-columns:1fr}
  .top h1{font-size:1.02rem}
  .tabs{gap:5px}
  .tab{padding:6px 9px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){.say.playing{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="head-row">
      <div class="head-title">
        <h1>JLPT 單字例句（五十音順）</h1>
      </div>

</header>

<main id="main"></main>

</footer>

/* ---------------- render ---------------- */
const main = document.getElementById('main');
const chipnav = document.getElementById('chipnav');
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let current = 'n5';

function meanHTML(m){ return esc(m).replace(/（([^）]*)）/g,'<span style="color:var(--sub);font-size:.85em">（$1）</span>'); }

function cardKANA50(it, idx){
  const numBadge = idx ? `<span class="idx-badge">${idx}.</span>` : '';
  return `<div class="card kana-card" data-s="${esc((it.ww+it.wk+it.r+it.m+it.ex).toLowerCase())}" data-mean="${esc(it.m)}">
    <div class="card-top">
      ${numBadge}<button class="word jp" data-text="${esc(it.wk)}" title="點擊發音（單字）">${esc(it.ww)}</button>
    </div>
    <div class="k50-row2">
      <span class="kana jp">${esc(it.wk)}</span>
      <span class="romaji">${esc(it.r)}</span>
      <span class="k50-zh">${meanHTML(it.m)}</span>
    </div>
    <div class="ex">
      <div class="ex-line">
        <div class="ex-ja jp">${esc(it.ex)}</div>
        <button class="say ex" data-text="${esc(it.ex)}" title="播放例句"></button>
      </div>
      <div class="ex-kana jp">${esc(it.exk)}</div>
      <div class="ex-zh">${esc(it.exm)}</div>
    </div>
  </div>`;
}

const RENDER = { n5:cardKANA50, n4:cardKANA50, n3:cardKANA50, n2:cardKANA50, n1:cardKANA50 };
function render(ch){
  current = ch;
  const cats = DATA[ch] || [];
  const cardFn = RENDER[ch] || cardKANA50;
  const multiCat = cats.length > 1;
  let html = '', chips = '';
  if(!cats.length){
    main.innerHTML = '<p class="empty-note">此級別尚未收錄，敬請期待。</p>';
    chipnav.innerHTML = '';
    chipnav.style.display = 'none';
    return;
  }
  cats.forEach((c,ci)=>{
    const id = ch+'-'+ci;
    const groups = c.groups || [{sub:null, items:(c.items||[])}];
    const count = groups.reduce((n,g)=>n+g.items.length,0);
    if(multiCat){
      const short = c.title.replace(/（[^）]*）/,'');
      chips += `<a href="#${id}">${esc(short)}</a>`;
    }
    const playBtns = `<button class="play-all play-kana50"><span class="ico"></span> 全部播放單字（中→日）</button>
        <button class="play-all play-ex-zhja"><span class="ico"></span> 全部播放例句（中→日）</button>`;
    html += `<section class="cat" id="${id}">
      <div class="cat-h">
        <h2 class="jp">${esc(c.title)}</h2>
        <span class="cnt">${count} 項</span>
        ${playBtns}
      </div>`;
    let idxCounter = 0;
    groups.forEach((g,gi)=>{
      const gid = id+'-g'+gi;
      const gridId = gid+'-grid';
      if(g.sub){
        const groupBtns = `
          <button class="play-all play-kana50-g" data-target="${gridId}"><span class="ico"></span> 播放單字（中→日）</button>
          <button class="play-all play-ex-zhja-g" data-target="${gridId}"><span class="ico"></span> 播放例句</button>`;
        html += `<div class="subhead" id="${gid}">${esc(g.sub)}${groupBtns}</div>`;
        if(!multiCat) chips += `<a href="#${gid}">${esc(g.sub.replace(/（[^）]*）/,''))}</a>`;
      }
      html += `<div class="grid" id="${gridId}">` + g.items.map(it=>cardFn(it, ++idxCounter)).join('') + '</div>';
    });
    html += '</section>';
  });
  main.innerHTML = html;
  chipnav.innerHTML = chips;
  chipnav.style.display = chips ? '' : 'none';
  applyFilter(document.getElementById('q').value);
}

/* tabs */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    stopAll();
    render(t.dataset.ch);
    window.scrollTo({top:0});
  });
});

/* search filter */
const q = document.getElementById('q');
function applyFilter(v){
  v = (v||'').trim().toLowerCase();
  document.querySelectorAll('#main .card').forEach(card=>{
    card.classList.toggle('hidden', v && !card.dataset.s.includes(v));
  });
  document.querySelectorAll('#main .cat').forEach(sec=>{
    const any = sec.querySelector('.card:not(.hidden)');
    sec.classList.toggle('hidden', !any);
  });
  document.querySelectorAll('#main .subhead').forEach(sh=>{
    let el = sh.nextElementSibling;
    const any = el && el.querySelector && el.querySelector('.card:not(.hidden)');
    sh.classList.toggle('hidden', !any);
  });
}
q.addEventListener('input', e=>applyFilter(e.target.value));

/* ---------------- speech ---------------- */
const supported = 'speechSynthesis' in window;
let jaVoice = null;
let zhVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja(-|_)?/i.test(v.lang)) || vs.find(v=>/japanese/i.test(v.name)) || null;
  zhVoice = vs.find(v=>/zh-TW|zh_TW|Hant/i.test(v.lang+v.name)) || vs.find(v=>/zh(-|_)?/i.test(v.lang)) || null;
  const note = document.getElementById('voiceNote');
  if(!supported){ note.textContent='⚠ 此瀏覽器不支援語音合成，發音按鈕已停用。'; }
  else if(jaVoice){ note.textContent='🔊 目前日語語音：'+jaVoice.name; }
  else { note.textContent='🔊 語音已就緒（未偵測到專用日語語音，將使用預設語音）。'; }
}
if(supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

let runId = 0;
function stopAll(){
  runId++;
  if(supported) speechSynthesis.cancel();
  document.querySelectorAll('.say.playing, .word.playing, .play-all.playing').forEach(b=>b.classList.remove('playing'));
}
function makeUtter(text, lang){
  lang = lang || 'ja-JP';
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.9;
  if(lang.startsWith('ja')){
    if(!jaVoice) pickVoice();
    if(jaVoice) u.voice = jaVoice;
  } else if(lang.startsWith('zh')){
    if(zhVoice) u.voice = zhVoice;
  }
  return u;
}
function speakOne(btn){
  const text = btn.dataset.text||'';
  stopAll();
  if(!text || !supported) return;
  const my = runId;
  btn.classList.add('playing');
  const u = makeUtter(text);
  u.onend = u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
  speechSynthesis.speak(u);
}
const SEQUENCE_GAP_MS = 800;
function speakSequence(btn, items){
  const was = btn.classList.contains('playing');
  stopAll();
  if(was || !supported || !items.length) return;
  const my = runId;
  btn.classList.add('playing');
  let i=0;
  (function next(){
    if(my!==runId) return;
    if(i>=items.length){ btn.classList.remove('playing'); return; }
    const {text,lang} = items[i++];
    const u = makeUtter(text, lang);
    u.onend = ()=>{ if(my===runId) setTimeout(next, SEQUENCE_GAP_MS); };
    u.onerror = ()=>{ if(my===runId) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  })();
}
function collectMeanWordZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const mean = card.dataset.mean;
    const word = card.querySelector('.word')?.dataset.text;
    if(mean) items.push({text:mean, lang:'zh-TW'});
    if(word) items.push({text:word, lang:'ja-JP'});
  });
  return items;
}
function collectExamplesZhJa(container){
  const items = [];
  container.querySelectorAll('.card:not(.hidden)').forEach(card=>{
    const zh = card.querySelector('.ex-zh')?.textContent;
    const ja = card.querySelector('.say.ex')?.dataset.text;
    if(zh) items.push({text:zh, lang:'zh-TW'});
    if(ja) items.push({text:ja, lang:'ja-JP'});
  });
  return items;
}
function speakAllKanaWords(btn){
  speakSequence(btn, collectMeanWordZhJa(btn.closest('.cat')));
}
function speakExamplesZhJa(btn){
  speakSequence(btn, collectExamplesZhJa(btn.closest('.cat')));
}
function speakGroupWords(btn){
  const grid = document.getElementById(btn.dataset.target);
  if(grid) speakSequence(btn, collectMeanWordZhJa(grid));
}
function speakGroupExamplesZhJa(btn){
  const grid = document.getElementById(btn.dataset.target);
  if(grid) speakSequence(btn, collectExamplesZhJa(grid));
}
document.addEventListener('click', e=>{
  const pkg = e.target.closest('.play-kana50-g');
  if(pkg){ speakGroupWords(pkg); return; }
  const peg = e.target.closest('.play-ex-zhja-g');
  if(peg){ speakGroupExamplesZhJa(peg); return; }
  const pk = e.target.closest('.play-kana50');
  if(pk){ speakAllKanaWords(pk); return; }
  const pe = e.target.closest('.play-ex-zhja');
  if(pe){ speakExamplesZhJa(pe); return; }
  const s = e.target.closest('.say, .word');
  if(s){ speakOne(s); return; }
});

/* init */
render('n5');

</script>
